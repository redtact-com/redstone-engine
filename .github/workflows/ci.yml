name: ci

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust の toolchain (rust-toolchain.toml のとおり)
        run: |
          rustup toolchain install || true
          rustup show
      - uses: Swatinem/rust-cache@v2
      - name: 整形
        run: cargo fmt --all --check
      - name: lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: テスト
        run: cargo test --workspace
      - name: 族を外した組み立て (族の素子が UNIMPLEMENTED を返す)
        run: cargo test -p rse-engine --no-default-features
      - name: wasm のビルド
        run: cargo build -p rse-wasm --target wasm32-unknown-unknown --release
      # 大きさの報告 (wasm・状態表の JSON・JS) は js の job でまとめて出す (重ねない)

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # engine-js のテストは wasm と状態表の JSON を使う。npm test の前 (pretest) に cargo で作る
      - name: Rust の toolchain (rust-toolchain.toml のとおり)
        run: |
          rustup toolchain install || true
          rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 型
        run: npm run typecheck
      - name: テスト (wasm と状態表の JSON を作ってから。fixture の wasm での実行・IP の検査を含む)
        run: npm test
      - name: 大きさの報告 (wasm・状態表の JSON・JS。合否にしない)
        run: npm run size
